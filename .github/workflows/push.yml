name: Issue notifications
# Every 15 minutes: if a new issue has gone live in the binder, send a push notification to staff who turned them on.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: push-notify
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock web-push@3
      - run: node tools/push.mjs
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
      - name: Save what has been announced
        run: |
          if [ -n "$(git status --porcelain push-state.json)" ]; then
            git config user.name "ergs-notify-bot"
            git config user.email "actions@users.noreply.github.com"
            git add push-state.json
            git commit -m "Record announced issues [skip ci]"
            git push
          fi
